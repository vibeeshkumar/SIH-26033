<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="FarmConnect Order Workflow">
<rect width="1200" height="720" fill="#f7faf7"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#205b37">FarmConnect Order Workflow</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b5c"/></marker></defs><rect x="55" y="180" width="190" height="90" rx="18" fill="#e5f2e8" stroke="#39754b" stroke-width="3"/><text x="150" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Farmer Login</text><rect x="290" y="180" width="190" height="90" rx="18" fill="#e5f2e8" stroke="#39754b" stroke-width="3"/><text x="385" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Add Produce</text><rect x="525" y="180" width="190" height="90" rx="18" fill="#e5f2e8" stroke="#39754b" stroke-width="3"/><text x="620" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Publish Listing</text><rect x="760" y="180" width="190" height="90" rx="18" fill="#e5f2e8" stroke="#39754b" stroke-width="3"/><text x="855" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Buyer Search</text><rect x="995" y="180" width="160" height="90" rx="18" fill="#e5f2e8" stroke="#39754b" stroke-width="3"/><text x="1075" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Place Order</text><path d="M245 225 L290 225" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M480 225 L525 225" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M715 225 L760 225" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M950 225 L995 225" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="850" y="420" width="260" height="95" rx="18" fill="#fceccf" stroke="#39754b" stroke-width="3"/><text x="980" y="474.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Farmer Confirms Order</text><rect x="490" y="420" width="260" height="95" rx="18" fill="#e5f2e8" stroke="#39754b" stroke-width="3"/><text x="620" y="474.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Pack & Dispatch</text><rect x="130" y="420" width="260" height="95" rx="18" fill="#dceaf8" stroke="#39754b" stroke-width="3"/><text x="260" y="474.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#173d27">Buyer Receives Order</text><path d="M1075 270 L980 420" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M850 468 L750 468" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M490 468 L390 468" stroke="#527b5c" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="20" fill="#555">Order status is updated and shared with the buyer at each stage</text>
</svg>